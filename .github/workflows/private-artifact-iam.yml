name: Verify private artifact builder permissions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'TheOutdoorProgrammer/manifests.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: node --test frontend/scripts/verify-builder-artifact-iam.test.mjs
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: nwf-shared
          workload_identity_provider: projects/155511170166/locations/global/workloadIdentityPools/github/providers/github
          service_account: manifests-builder@nwf-shared.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - name: Verify create-only artifacts and read-only receipts
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node frontend/scripts/verify-builder-artifact-iam.mjs
